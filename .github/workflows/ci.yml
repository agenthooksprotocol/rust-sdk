name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 6327cb47b15eba7a2ec4bd6c9a32cb19eeabfd3d
          path: shared-spec
      - run: mv shared-spec ../agent-hooks-protocol
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: Check generated artifacts
        run: python3 ../agent-hooks-protocol/tools/generate_sdk.py --rust-sdk . --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo check --locked --no-default-features --lib
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --features reqwest,axum,tokio-process
      - run: cargo test --locked --features interop
        env:
          AHP_SCHEMA_DIR: ../agent-hooks-protocol/schema/draft
          AHP_INTEROP_FIXTURE_ROOT: ../agent-hooks-protocol/interop
